<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Translation Tool</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background-color: #ffffff;
      width: 100%; 
      max-width: 800px;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    select, button {
      padding: 10px 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
      outline: none;
    }

    select {
      flex: 1;
      background-color: #f9f9f9;
      cursor: pointer;
    }

    .swap-btn {
      background-color: #f0f0f0;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .swap-btn:hover {
      background-color: #e0e0e0;
    }

    .translation-box {
      display: flex;
      gap: 15px;
      flex-direction: column;
    }

    @media (min-width: 600px) {
      .translation-box {
        flex-direction: row;
      }
    }

    .text-area-wrapper {
      flex: 1;
      position: relative;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      resize: none;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #667eea;
    }

    textarea[readonly] {
      background-color: #f8f9fa;
    }

    .actions {
      margin-top: 8px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: #555;
      padding: 5px;
      transition: color 0.2s;
    }

    .action-btn:hover {
      color: #667eea;
    }

    .translate-btn {
      width: 100%;
      margin-top: 15px;
      background-color: #667eea;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .translate-btn:hover {
      background-color: #5a67d8;
    }

    .status-msg {
      text-align: center;
      font-size: 14px;
      color: #777;
      margin-top: 10px;
      height: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Language Translator</h1>

    <!-- 1. Language Selectors -->
    <div class="controls">
      <select id="sourceLang">
        <option value="autodetect">Auto Detect</option>
        <option value="en">English</option>
        <option value="te">Telugu</option>
        <option value="hi">Hindi</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="zh">Chinese</option>
        <option value="ja">Japanese</option>
        <option value="ar">Arabic</option>
        <option value="ru">Russian</option>
        <option value="pt">Portuguese</option>
      </select>

      <button class="swap-btn" id="swapLangBtn" title="Swap Languages">⇄</button>

      <select id="targetLang">
        <option value="es">Spanish</option>
        <option value="te">Telugu</option>
        <option value="en">English</option>
        <option value="hi">Hindi</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="zh">Chinese</option>
        <option value="ja">Japanese</option>
        <option value="ar">Arabic</option>
        <option value="ru">Russian</option>
        <option value="pt">Portuguese</option>
      </select>
    </div>

    <!-- Text Input & Display Output Areas -->
    <div class="translation-box">
      <div class="text-area-wrapper">
        <textarea id="sourceText" placeholder="Enter text here..."></textarea>
        <div class="actions">
          <button class="action-btn" id="speakSourceBtn" title="Listen Input">🔊</button>
        </div>
      </div>

      <div class="text-area-wrapper">
        <textarea id="targetText" placeholder="Translation will appear here..." readonly></textarea>
        <div class="actions">
          <button class="action-btn" id="speakTargetBtn" title="Listen Translation">🔊</button>
          <button class="action-btn" id="copyBtn" title="Copy Translation">📋</button>
        </div>
      </div>
    </div>

    <!-- Translate Action Button -->
    <button class="translate-btn" id="translateBtn">Translate</button>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <script>
    const sourceText = document.getElementById('sourceText');
    const targetText = document.getElementById('targetText');
    const sourceLang = document.getElementById('sourceLang');
    const targetLang = document.getElementById('targetLang');
    const translateBtn = document.getElementById('translateBtn');
    const swapLangBtn = document.getElementById('swapLangBtn');
    const copyBtn = document.getElementById('copyBtn');
    const speakSourceBtn = document.getElementById('speakSourceBtn');
    const speakTargetBtn = document.getElementById('speakTargetBtn');
    const statusMsg = document.getElementById('statusMsg');

    // Utility function to convert HTML entities (e.g., &#39; to ')
    function decodeHTMLEntities(text) {
      const textarea = document.createElement('textarea');
      textarea.innerHTML = text;
      return textarea.value;
    }

    // 2 & 3. Process Input via API and Receive Response
    async function translateText() {
      const text = sourceText.value.trim();
      if (!text) {
        targetText.value = '';
        return;
      }

      statusMsg.textContent = 'Translating...';

      const src = sourceLang.value === 'autodetect' ? 'autodetect' : sourceLang.value;
      const tgt = targetLang.value;
      
      const langPair = `${src}|${tgt}`;
      const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langPair}`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.responseStatus === 200 && data.responseData) {
          // 4. Display translated text clearly
          targetText.value = decodeHTMLEntities(data.responseData.translatedText);
          statusMsg.textContent = '';
        } else {
          statusMsg.textContent = data.responseDetails || 'Translation failed. Please try again.';
        }
      } catch (error) {
        console.error('Error translating text:', error);
        statusMsg.textContent = 'Network error. Please check your connection.';
      }
    }

    // Event Listener for Translation
    translateBtn.addEventListener('click', translateText);

    // Swap Source and Target Languages
    swapLangBtn.addEventListener('click', () => {
      if (sourceLang.value === 'autodetect') {
        statusMsg.textContent = 'Select a specific language to swap.';
        setTimeout(() => { statusMsg.textContent = ''; }, 2000);
        return;
      }
      
      const tempLang = sourceLang.value;
      sourceLang.value = targetLang.value;
      targetLang.value = tempLang;

      const tempText = sourceText.value;
      sourceText.value = targetText.value;
      targetText.value = tempText;
    });

    // 5. Optional Feature: Copy to Clipboard
    copyBtn.addEventListener('click', () => {
      if (!targetText.value) return;
      navigator.clipboard.writeText(targetText.value).then(() => {
        statusMsg.textContent = 'Copied to clipboard!';
        setTimeout(() => { statusMsg.textContent = ''; }, 2000);
      });
    });

    // 5. Optional Feature: Text-to-Speech (TTS) using Web Speech API
    function speak(text, lang) {
      if (!text) return;
      window.speechSynthesis.cancel(); // Stops previous speech
      const utterance = new SpeechSynthesisUtterance(text);
      if (lang && lang !== 'autodetect') {
        utterance.lang = lang;
      }
      window.speechSynthesis.speak(utterance);
    }

    speakSourceBtn.addEventListener('click', () => {
      speak(sourceText.value, sourceLang.value);
    });

    speakTargetBtn.addEventListener('click', () => {
      speak(targetText.value, targetLang.value);
    });
  </script>
</body>
</html>
